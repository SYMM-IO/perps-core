		<script type="module">
			import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.min.js";
			import { BASE_TYPES, PartyAFacetAbi, InstantLayerAbi, FN_SIGNATURE } from "./constants.js";

			// 🔧 CONFIG — FILL THESE IN

			// InstantLayer deployed address (verifier/executor for EIP-712)
			const INSTANT_LAYER_ADDR = "0x4A679253410272dd5232B3Ff7cF5dbB88f295319";
			// Diamond (PartyAFacet target) address
			const DIAMOND_ADDR = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0";
			// MultiAccount deployed address
			const MULTIACCOUNT_ADDR = "0x59b670e9fA9D0A427751Af201D676719a970857b";

			// If your EIP-712 domain in Solidity includes a domain salt, add it below:
			const DOMAIN_SALT = null; // e.g. "0x0000...". Keep null if not used in contract's domain.

			// ===========================
			// helpers
			// ===========================
			const logEl = document.getElementById("log");
			function log(...args) {
				console.log(...args);
				logEl.textContent += args.map(a => (typeof a === "string" ? a : JSON.stringify(a, null, 2))).join(" ") + "\n";
			}

			// Utility: wait for injection and prefer MetaMask if multiple providers exist
			async function detectProvider(timeoutMs = 1500) {
				if (window.ethereum) return window.ethereum;
				await new Promise(resolve => {
					window.addEventListener("ethereum#initialized", resolve, { once: true });
					setTimeout(resolve, timeoutMs);
				});
				let eth = window.ethereum || null;
				if (eth?.providers?.length) {
					eth = eth.providers.find(p => p.isMetaMask) || eth.providers[0];
				}
				return eth;
			}

			// Utility: switch to target chain (and optionally add if missing)
			async function ensureChain(ethereum, requiredChainIdHex, addChainParams) {
				try {
					await ethereum.request({
						method: "wallet_switchEthereumChain",
						params: [{ chainId: requiredChainIdHex }],
					});
				} catch (err) {
					// 4902 = unknown chain; add it if params are provided
					if (err?.code === 4902 && addChainParams) {
						await ethereum.request({
							method: "wallet_addEthereumChain",
							params: [addChainParams],
						});
					} else {
						throw err;
					}
				}
				console.log("chain is Ethereum!");
			}

			async function connectWallet(options = {}) {
				const {
					requiredChainId, // number (e.g., 31337) or hex string (e.g., '0x7a69'); optional
					addChainParams, // EIP-3085 params to add the chain if missing; optional
					onAccountsChanged, // callback(addresses[])
					onChainChanged, // callback(chainIdHex)
				} = options;

				// 1) Detect provider
				const ethereum = await detectProvider();
				if (!ethereum) {
					throw new Error("No injected wallet found. Install MetaMask or open in a wallet browser.");
				}

				// 2) Request account access (handle pending requests)
				try {
					await ethereum.request({ method: "eth_requestAccounts" });
				} catch (err) {
					if (err?.code === 4001) throw new Error("User rejected the connection request.");
					if (err?.code === -32002) throw new Error("A connection request is already pending in your wallet.");
					throw err;
				}

				// 3) Wrap with ethers v6
				const { ethers } = await import("https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.min.js");
				const provider = new ethers.BrowserProvider(ethereum);
				const signer = await provider.getSigner();

				// 4) Optionally enforce a specific chain
				if (requiredChainId != null) {
					const requiredHex = typeof requiredChainId === "string" ? requiredChainId : "0x" + requiredChainId.toString(16);
					await ensureChain(ethereum, requiredHex, addChainParams);
				}

				// 5) Read current state
				const who = await signer.getAddress();
				const net = await provider.getNetwork();
				const chainId = Number(net.chainId); // ethers v6 chainId is bigint

				// 6) Clean up only if we actually have old listeners
				if (typeof window.__onAccountsChanged === "function") {
					ethereum.removeListener?.("accountsChanged", window.__onAccountsChanged);
				}
				if (typeof window.__onChainChanged === "function") {
					ethereum.removeListener?.("chainChanged", window.__onChainChanged);
				}

				// attach fresh listeners
				window.__onAccountsChanged = accs => {
					onAccountsChanged?.(accs);
					// You might want to update UI here, e.g.:
					// document.getElementById('who').textContent = accs[0] ? `Connected: ${accs[0]}` : 'Disconnected';
				};
				window.__onChainChanged = cid => {
					onChainChanged?.(cid);
					// Most dapps reload on chain change to reset providers/signers:
					// window.location.reload();
				};

				ethereum.on?.("accountsChanged", window.__onAccountsChanged);
				ethereum.on?.("chainChanged", window.__onChainChanged);

				// 7) Update UI and return
				const whoEl = document.getElementById("who");
				if (whoEl) whoEl.textContent = `Connected: ${who} (chainId=${chainId})`;

				return { ethers, provider, signer, who, chainId, ethereum };
			}

			function encodeParamsOnly(args) {
				// Build full calldata first, then strip the first 4 bytes (selector)
				const iface = new ethers.Interface(PartyAFacetAbi);
				const full = iface.encodeFunctionData("sendQuoteWithAffiliate", args); // 0x + selector + params
				const selector = full.slice(0, 10); // 0x + 8 hex chars
				const paramsOnly = "0x" + full.slice(10);
				const paramHash = ethers.keccak256(paramsOnly);
				return { full, selector, paramsOnly, paramHash };
			}

			function buildDomain(chainId) {
				// Must match your Solidity EIP-712 domain (name, version, chainId, verifyingContract[, salt])
				const domain = {
					name: "SymmioInstantLayer",
					version: "1",
					chainId,
					verifyingContract: INSTANT_LAYER_ADDR,
				};
				if (DOMAIN_SALT) domain.salt = DOMAIN_SALT;
				return domain;
			}

			// ----------------------------------------------------
			// Template helpers (mirror test shape)
			// ----------------------------------------------------

			// Example "ops graph" like your test. Adjust as needed.
			// Here: 4 slots; op[2] & op[3] depend on op[0].
			const TEMPLATE_OPS = [
				{ sourceIndices: [], insertionPoints: [] },
				{ sourceIndices: [], insertionPoints: [] },
				{ sourceIndices: [], insertionPoints: [] },
				{ sourceIndices: [], insertionPoints: [] },
			];

			// Create a template if it doesn't exist; return its ID.
			async function ensureTemplate(instant) {
				// getLastTemplateID() returns next id to be assigned in many patterns; adapt if your contract differs.

				const lastId = await instant.getLastTemplateID();
				const maybeExisting = lastId > 0n ? lastId - 1n : 0n;
				console.log("Template ID:", lastId);

				// If there is at least one template, reuse the latest and ensure it's active.
				if (lastId > 0n) {
					const isActive = await instant.isTemplateActive(maybeExisting); // if you don't have this view, skip and trust it's active
					if (!isActive) {
						const tx = await instant.setTemplateActive(maybeExisting, true);
						await tx.wait();
					}
					return maybeExisting;
				}

				// Otherwise, add a fresh one
				const tx = await instant.addTemplate("MyTempFull", TEMPLATE_OPS);
				const rcpt = await tx.wait();
				// Some contracts emit an event with the new ID; if not, query again:
				const newId = (await instant.getLastTemplateID()) - 1n;
				return newId;
			}

			// Build a SignedOperation in the same shape as your tests
			function buildSignedOp({ signerAddr, callData, multiAccount, accountAddr, nonce, deadline, salt }) {
				return {
					signer: signerAddr,
					params: { callData },
					signerInfo: {
						multiAccount: multiAccount ?? ethers.ZeroAddress,
						addr: accountAddr ?? ethers.ZeroAddress,
					},
					replayAttackHeader: {
						nonce: BigInt(nonce),
						deadline: BigInt(deadline),
						salt,
					},
				};
			}

			// ===========================
			// UI events
			// ===========================
			let context = null;
			document.getElementById("connect").onclick = async () => {
				try {
					context = await connectWallet();
				} catch (e) {

			document.getElementById("executeBatch").onclick = async () => {
				try {
					if (!context) context = await connectWallet();
					const { provider, signer, who, chainId } = context;

					// --------------------------
					// Example args (fill with real values)

					const now = Math.floor(Date.now() / 1000);
					const args = [
						/* partyBsWhiteList */ [],
						/* symbolId        */ 1n,

						/* price           */ 10n,

						/* cva             */ 22n,
						/* lf              */ 3n,
						/* partyAmm        */ 75n,
						/* partyBmm        */ 40n,
						/* maxFundingRate  */ 2n, // 0.02 with 18 decimals, adjust to your spec
						/* deadline        */ BigInt(now + 600),
						/* affiliate       */ "0x0000000000000000000000000000000000000000",
						/* upnlSig         */ {
							upnl: 0n,
							price: 0n,
							timestamp: BigInt(now),
							reqId: 0n,
							gatewaySignature: "0x",
						},
					];

					// 1) Encode paramsOnly + hash
					const { full, selector, paramsOnly, paramHash } = encodeParamsOnly(args);

					const keyValue = ""; // or your "symbolId=1;price=10;..." string
					const keyValueHash = keyValue ? ethers.keccak256(ethers.toUtf8Bytes(keyValue)) : ethers.ZeroHash;

					// 2) Build signable object ( NO signature)
					const sop = {
						signer: who,
						params: {
							callData: full, // bytes, params-only (no selector)
						},
						signerInfo: {
							multiAccount: MULTIACCOUNT_ADDR,
							addr: "0x0000000000000000000000000000000000000000", // fill with your account address
						},
						replayAttackHeader: {
							nonce: 1n,
							deadline: BigInt(now + 600),
							salt: ethers.hexlify(ethers.randomBytes(32)), // replay guard salt (NOT the domain salt)
						},
					};

					// 3) EIP-712 domain
					const domain = buildDomain(chainId);

					// 4) Ask the wallet to sign typed data
					const signature = await signer.signTypedData(domain, BASE_TYPES, sop);

					// 5) Call InstantLayer.executeBatch
					const instant = new ethers.Contract(INSTANT_LAYER_ADDR, InstantLayerAbi, signer);

					// SignatureCallData struct contains signature + callData (paramsOnly bytes)
					const sigCallData = {
						signature: signature,
					};

					const OPERATOR_ROLE = await instant.OPERATOR_ROLE();
					let tx = await instant.grantRole(OPERATOR_ROLE, who);
					await tx.wait();

					tx = await instant.executeBatch([sop], [sigCallData]);
					log("tx sent:", tx.hash);
					const rcpt = await tx.wait();
					log("tx confirmed in block", rcpt.blockNumber);
				} catch (e) {
					console.error(e);
					log("ERROR:", e.reason ?? e.message ?? String(e));
				}
			};
