<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 695" width="1120" height="695" role="img" aria-labelledby="title-fees desc-fees"><title id="title-fees">Fee quote and limit protocol</title><desc id="desc-fees">Figure 7. Contract-supported integration path. The supplied GaslessQ service has not adopted these unified quote calls. A successful simulation is deliberately returned through a custom revert.</desc><defs><marker id="arrow-fees" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a98ab"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc" rx="16"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b45">Fee quote and limit protocol</text><path id="edge-fees-0" data-edge="0" d="M 320,149 H 410" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><path id="edge-fees-1" data-edge="1" d="M 710,149 H 800" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><path id="edge-fees-2" data-edge="2" d="M 950,218 V 275" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><path id="edge-fees-3" data-edge="3" d="M 800,344 H 710" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><path id="edge-fees-4" data-edge="4" d="M 410,344 H 320" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><path id="edge-fees-5" data-edge="5" d="M 170,413 V 470" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><path id="edge-fees-6" data-edge="6" d="M 320,539 H 410" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><path id="edge-fees-7" data-edge="7" d="M 710,539 H 800" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-fees)"/><a href="#source-C12" data-node="0" data-model="fees" tabindex="0" aria-label="1 · Encode the action. Prepare the same inner calldata for quote and execution."><g><title>Client / relayer integration: Prepare the same inner calldata for quote and execution. Sources: C12</title><rect class="node-bg" x="20" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="80" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="20" y="96" width="300" height="14" fill="#f0edfa"/><text x="35" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="35" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">1 · Encode the action</text><text x="35" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Prepare the same inner calldata for quote</text><text x="35" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">and execution.</text></g></a><a href="#source-C8" data-node="1" data-model="fees" tabindex="0" aria-label="2 · Preview fee. previewFeeQuote: state-based estimate; exact=false."><g><title>GaslessLayer: previewFeeQuote: state-based estimate; exact=false. Sources: C8 C9</title><rect class="node-bg" x="410" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="80" width="300" height="30" rx="12" fill="#e8f5ee"/><rect x="410" y="96" width="300" height="14" fill="#e8f5ee"/><text x="425" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#137552">CONTRACT</text><text x="425" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">2 · Preview fee</text><text x="425" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">previewFeeQuote: state-based estimate;</text><text x="425" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">exact=false.</text></g></a><a href="#source-C10" data-node="2" data-model="fees" tabindex="0" aria-label="3 · Choose cap and sign. Optional signed fee cap is bound into the operation."><g><title>Vibe browser: Optional signed fee cap is bound into the operation. Sources: C10 C11 C12</title><rect class="node-bg" x="800" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="80" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="800" y="96" width="300" height="14" fill="#e9f5f8"/><text x="815" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="815" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">3 · Choose cap and sign</text><text x="815" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Optional signed fee cap is bound into the</text><text x="815" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">operation.</text></g></a><a href="#source-C12" data-node="3" data-model="fees" tabindex="0" aria-label="4 · Request exact simulation. eth_call with complete signatures, real from and native value."><g><title>Client / relayer integration: eth_call with complete signatures, real from and native value. Sources: C12</title><rect class="node-bg" x="800" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="275" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="800" y="291" width="300" height="14" fill="#f0edfa"/><text x="815" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="815" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">4 · Request exact simulation</text><text x="815" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">eth_call with complete signatures, real</text><text x="815" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">from and native value.</text></g></a><a href="#source-C9" data-node="4" data-model="fees" tabindex="0" aria-label="5 · Run actual checks. Execute roles, authorization, action and fee collection in simulation."><g><title>GaslessLayer: Execute roles, authorization, action and fee collection in simulation. Sources: C9</title><rect class="node-bg" x="410" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="275" width="300" height="30" rx="12" fill="#e8f5ee"/><rect x="410" y="291" width="300" height="14" fill="#e8f5ee"/><text x="425" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#137552">CONTRACT</text><text x="425" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">5 · Run actual checks</text><text x="425" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Execute roles, authorization, action and</text><text x="425" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">fee collection in simulation.</text></g></a><a href="#source-C9" data-node="5" data-model="fees" tabindex="0" aria-label="6 · Revert with result. FeeQuoteResult = simulated success. ExecutionFailed wraps failure."><g><title>GaslessLayer: FeeQuoteResult = simulated success. ExecutionFailed wraps failure. Sources: C9</title><rect class="node-bg" x="20" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="275" width="300" height="30" rx="12" fill="#e8f5ee"/><rect x="20" y="291" width="300" height="14" fill="#e8f5ee"/><text x="35" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#137552">CONTRACT</text><text x="35" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">6 · Revert with result</text><text x="35" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">FeeQuoteResult = simulated success.</text><text x="35" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">ExecutionFailed wraps failure.</text></g></a><a href="#source-C7" data-node="6" data-model="fees" tabindex="0" aria-label="7 · Decode and evaluate. 18-decimal totals and payer breakdown; no state was committed."><g><title>Client / relayer integration: 18-decimal totals and payer breakdown; no state was committed. Sources: C7 C12</title><rect class="node-bg" x="20" y="470" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="470" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="20" y="486" width="300" height="14" fill="#f0edfa"/><text x="35" y="490" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="35" y="523" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">7 · Decode and evaluate</text><text x="35" y="547" font-family="Arial,sans-serif" font-size="13" fill="#45566b">18-decimal totals and payer breakdown; no</text><text x="35" y="563" font-family="Arial,sans-serif" font-size="13" fill="#45566b">state was committed.</text></g></a><a href="#source-C8" data-node="7" data-model="fees" tabindex="0" aria-label="8 · Submit actual action. Direct action or executeWithFeeLimit; original permissions retained."><g><title>Client / relayer integration: Direct action or executeWithFeeLimit; original permissions retained. Sources: C8 C9</title><rect class="node-bg" x="410" y="470" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="470" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="410" y="486" width="300" height="14" fill="#f0edfa"/><text x="425" y="490" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="425" y="523" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">8 · Submit actual action</text><text x="425" y="547" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Direct action or executeWithFeeLimit;</text><text x="425" y="563" font-family="Arial,sans-serif" font-size="13" fill="#45566b">original permissions retained.</text></g></a><a href="#source-S3" data-node="8" data-model="fees" tabindex="0" aria-label="9 · Confirm separately. Actual receipt and business-state checks still establish completion."><g><title>Executor worker: Actual receipt and business-state checks still establish completion. Sources: S3</title><rect class="node-bg" x="800" y="470" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="470" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="800" y="486" width="300" height="14" fill="#f0edfa"/><text x="815" y="490" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="815" y="523" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">9 · Confirm separately</text><text x="815" y="547" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Actual receipt and business-state checks</text><text x="815" y="563" font-family="Arial,sans-serif" font-size="13" fill="#45566b">still establish completion.</text></g></a></svg>