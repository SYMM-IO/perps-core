<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 695" width="1120" height="695" role="img" aria-labelledby="title-deposits desc-deposits"><title id="title-deposits">Deposit: collateral arrival to Core credit</title><desc id="desc-deposits">Figure 4. Deposit settlement bypasses InstantLayer. Creation fees apply only when this transaction deploys the selected wallet. A new-account deposit adds a frontend account/balance readiness check.</desc><defs><marker id="arrow-deposits" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a98ab"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc" rx="16"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b45">Deposit: collateral arrival to Core credit</text><path id="edge-deposits-0" data-edge="0" d="M 320,149 H 410" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><path id="edge-deposits-1" data-edge="1" d="M 710,149 H 800" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><path id="edge-deposits-2" data-edge="2" d="M 950,218 V 275" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><path id="edge-deposits-3" data-edge="3" d="M 800,344 H 710" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><path id="edge-deposits-4" data-edge="4" d="M 410,344 H 320" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><path id="edge-deposits-5" data-edge="5" d="M 170,413 V 470" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><path id="edge-deposits-6" data-edge="6" d="M 320,539 H 410" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><path id="edge-deposits-7" data-edge="7" d="M 710,539 H 800" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-deposits)"/><a href="#source-F3" data-node="0" data-model="deposits" tabindex="0" aria-label="1 · Find the deposit wallet. Read collateral, fee, minimum and deterministic wallet address."><g><title>Vibe browser: Read collateral, fee, minimum and deterministic wallet address. Sources: F3</title><rect class="node-bg" x="20" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="80" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="20" y="96" width="300" height="14" fill="#e9f5f8"/><text x="35" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="35" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">1 · Find the deposit wallet</text><text x="35" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Read collateral, fee, minimum and</text><text x="35" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">deterministic wallet address.</text></g></a><a href="#source-F3" data-node="1" data-model="deposits" tabindex="0" aria-label="2 · Deliver collateral. Transfer or bridge delivers tokens to the destination-chain wallet."><g><title>Transfer / bridge: Transfer or bridge delivers tokens to the destination-chain wallet. Sources: F3 F4</title><rect class="node-bg" x="410" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="80" width="300" height="30" rx="12" fill="#fcf2e4"/><rect x="410" y="96" width="300" height="14" fill="#fcf2e4"/><text x="425" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#8a5818">OTHER / INFRASTRUCTURE</text><text x="425" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">2 · Deliver collateral</text><text x="425" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Transfer or bridge delivers tokens to the</text><text x="425" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">destination-chain wallet.</text></g></a><a href="#source-S2" data-node="2" data-model="deposits" tabindex="0" aria-label="3 · Accept settlement. Read balance, simulate, persist and publish settlement request."><g><title>GaslessQ APIs: Read balance, simulate, persist and publish settlement request. Sources: S2</title><rect class="node-bg" x="800" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="80" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="800" y="96" width="300" height="14" fill="#f0edfa"/><text x="815" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="815" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">3 · Accept settlement</text><text x="815" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Read balance, simulate, persist and</text><text x="815" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">publish settlement request.</text></g></a><a href="#source-S10" data-node="3" data-model="deposits" tabindex="0" aria-label="4 · Recheck and submit. Re-read wallet funding and send the settlement transaction."><g><title>Executor worker: Re-read wallet funding and send the settlement transaction. Sources: S10</title><rect class="node-bg" x="800" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="275" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="800" y="291" width="300" height="14" fill="#f0edfa"/><text x="815" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="815" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">4 · Recheck and submit</text><text x="815" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Re-read wallet funding and send the</text><text x="815" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">settlement transaction.</text></g></a><a href="#source-C1" data-node="4" data-model="deposits" tabindex="0" aria-label="5 · Sweep and collect fees. Deploy if needed. Net = gross − deposit fee − creation fee."><g><title>GaslessLayer: Deploy if needed. Net = gross − deposit fee − creation fee. Sources: C1 C8 C15</title><rect class="node-bg" x="410" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="275" width="300" height="30" rx="12" fill="#e8f5ee"/><rect x="410" y="291" width="300" height="14" fill="#e8f5ee"/><text x="425" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#137552">CONTRACT</text><text x="425" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">5 · Sweep and collect fees</text><text x="425" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Deploy if needed. Net = gross − deposit</text><text x="425" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">fee − creation fee.</text></g></a><a href="#source-C1" data-node="5" data-model="deposits" tabindex="0" aria-label="6 · Create or verify account. Destination belongs to owner. New settings come from relayer."><g><title>AccountLayer: Destination belongs to owner. New settings come from relayer. Sources: C1</title><rect class="node-bg" x="20" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="275" width="300" height="30" rx="12" fill="#e8f5ee"/><rect x="20" y="291" width="300" height="14" fill="#e8f5ee"/><text x="35" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#137552">CONTRACT</text><text x="35" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">6 · Create or verify account</text><text x="35" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Destination belongs to owner. New</text><text x="35" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">settings come from relayer.</text></g></a><a href="#source-C5" data-node="6" data-model="deposits" tabindex="0" aria-label="7 · Credit deposited balance. depositFor transfers collateral and credits 18-decimal balance."><g><title>SYMMIO Core: depositFor transfers collateral and credits 18-decimal balance. Sources: C5</title><rect class="node-bg" x="20" y="470" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="470" width="300" height="30" rx="12" fill="#e8f5ee"/><rect x="20" y="486" width="300" height="14" fill="#e8f5ee"/><text x="35" y="490" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#137552">CONTRACT</text><text x="35" y="523" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">7 · Credit deposited balance</text><text x="35" y="547" font-family="Arial,sans-serif" font-size="13" fill="#45566b">depositFor transfers collateral and</text><text x="35" y="563" font-family="Arial,sans-serif" font-size="13" fill="#45566b">credits 18-decimal balance.</text></g></a><a href="#source-S3" data-node="7" data-model="deposits" tabindex="0" aria-label="8 · Record receipt success. Service marks succeeded from receipt; stored credit is not reconciled."><g><title>Executor worker: Service marks succeeded from receipt; stored credit is not reconciled. Sources: S3 S10</title><rect class="node-bg" x="410" y="470" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="470" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="410" y="486" width="300" height="14" fill="#f0edfa"/><text x="425" y="490" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="425" y="523" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">8 · Record receipt success</text><text x="425" y="547" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Service marks succeeded from receipt;</text><text x="425" y="563" font-family="Arial,sans-serif" font-size="13" fill="#45566b">stored credit is not reconciled.</text></g></a><a href="#source-F4" data-node="8" data-model="deposits" tabindex="0" aria-label="9 · Discover funded account. New account: enumerate Vibecaps Main, then read Core balance."><g><title>Vibe browser: New account: enumerate Vibecaps Main, then read Core balance. Sources: F4</title><rect class="node-bg" x="800" y="470" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="470" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="800" y="486" width="300" height="14" fill="#e9f5f8"/><text x="815" y="490" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="815" y="523" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">9 · Discover funded account</text><text x="815" y="547" font-family="Arial,sans-serif" font-size="13" fill="#45566b">New account: enumerate Vibecaps Main,</text><text x="815" y="563" font-family="Arial,sans-serif" font-size="13" fill="#45566b">then read Core balance.</text></g></a></svg>