5" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="275" width="300" height="30" rx="12" fill="#e8f5ee"/><rect x="410" y="291" width="300" height="14" fill="#e8f5ee"/><text x="425" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#137552">CONTRACT</text><text x="425" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">5 · Transfer to recipient</text><text x="425" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">ERC20 or native; max amount sends</text><text x="425" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">post-fee balance.</text></g></a><a href="#source-C7" data-node="5" data-model="withdrawals" tabindex="0" aria-label="6 · Verify result. Check receipt, WalletFundsWithdrawn and recipient balance."><g><title>Owner wallet / client: Check receipt, WalletFundsWithdrawn and recipient balance. Sources: C7 C16</title><rect class="node-bg" x="20" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="275" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="20" y="291" width="300" height="14" fill="#e9f5f8"/><text x="35" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="35" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">6 · Verify result</text><text x="35" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Check receipt, WalletFundsWithdrawn and</text><text x="35" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">recipient balance.</text></g></a></svg>