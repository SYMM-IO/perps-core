<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-labelledby="title-withdrawals desc-withdrawals"><title id="title-withdrawals">Owner withdrawal: wallet funds to recipient</title><desc id="desc-withdrawals">Figure 5. Contract-supported direct withdrawal. The owner submits and pays gas; the inspected Vibe/GaslessQ path does not establish UI adoption. This transfers GaslessWallet funds, not balances held in Core.</desc><defs><marker id="arrow-withdrawals" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a98ab"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc" rx="16"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b45">Owner withdrawal: wallet funds to recipient</text><path id="edge-withdrawals-0" data-edge="0" d="M 320,149 H 410" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-withdrawals)"/><path id="edge-withdrawals-1" data-edge="1" d="M 710,149 H 800" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-withdrawals)"/><path id="edge-withdrawals-2" data-edge="2" d="M 950,218 V 275" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-withdrawals)"/><path id="edge-withdrawals-3" data-edge="3" d="M 800,344 H 710" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-withdrawals)"/><path id="edge-withdrawals-4" data-edge="4" d="M 410,344 H 320" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-withdrawals)"/><a href="#source-C16" data-node="0" data-model="withdrawals" tabindex="0" aria-label="1 · Select wallet and amount. Owner selects walletId, token, recipient and amount."><g><title>Owner wallet / client: Owner selects walletId, token, recipient and amount. Sources: C16</title><rect class="node-bg" x="20" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="80" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="20" y="96" width="300" height="14" fill="#e9f5f8"/><text x="35" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="35" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">1 · Select wallet and amount</text><text x="35" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Owner selects walletId, token, recipient</text><text x="35" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">and amount.</text></g></a><a href="#source-C12" data-node="1" data-model="withdrawals" tabindex="0" aria-label="2 · Quote with owner as from. Preview or simulate; optional totalDebit18 fee cap."><g><title>Owner wallet / client: Preview or simulate; optional totalDebit18 fee cap. Sources: C12 C16</title><rect class="node-bg" x="410" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="80" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="410" y="96" width="300" height="14" fill="#e9f5f8"/><text x="425" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="425" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">2 · Quote with owner as from</text><text x="425" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Preview or simulate; optional</text><text x="425" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">totalDebit18 fee cap.</text></g></a><a href="#source-C16" data-node="2" data-model="withdrawals" tabindex="0" aria-label="3 · Bind wallet to caller. withdrawWalletFunds derives the wallet from msg.sender."><g><title>GaslessLayer: withdrawWalletFunds derives the wallet from msg.sender. Sources: C16</title><rect class="node-bg" x="800" y="80" width="300" height="138" rx="12" fill="white" 