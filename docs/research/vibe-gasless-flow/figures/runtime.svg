<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 805" width="1120" height="805" role="img" aria-labelledby="title-runtime desc-runtime"><title id="title-runtime">Runtime units and their dependencies</title><desc id="desc-runtime">Figure 2. Separate services, storage, queue and contracts. The Vibe proxy-to-GaslessQ mapping is inferred; RPC reads and simulation are distinct from transaction broadcast.</desc><defs><marker id="arrow-runtime" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a98ab"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc" rx="16"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b45">Runtime units and their dependencies</text><path id="edge-runtime-0" data-edge="0" d="M 320,149 H 410" fill="none" stroke="#8a98ab" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-1" data-edge="1" d="M 710,149 H 800" fill="none" stroke="#8a98ab" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-2" data-edge="2" d="M 950,218 V 305" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-3" data-edge="3" d="M 950,218 V 261.5 H 560 V 305" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-4" data-edge="4" d="M 410,374 H 320" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-5" data-edge="5" d="M 170,443 V 540" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-6" data-edge="6" d="M 320,609 H 410" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-7" data-edge="7" d="M 710,609 H 800" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-runtime)"/><path id="edge-runtime-8" data-edge="8" d="M 170