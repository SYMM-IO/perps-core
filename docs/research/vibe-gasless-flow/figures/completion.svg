<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-labelledby="title-completion desc-completion"><title id="title-completion">From request identifier to business result</title><desc id="desc-completion">Figure 8. GaslessQ completion is receipt-based. Identifying the final account, credited amount or quote requires the subsequent business-state checks.</desc><defs><marker id="arrow-completion" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a98ab"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc" rx="16"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b45">From request identifier to business result</text><path id="edge-completion-0" data-edge="0" d="M 320,149 H 410" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-completion)"/><path id="edge-completion-1" data-edge="1" d="M 710,149 H 800" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-completion)"/><path id="edge-completion-2" data-edge="2" d="M 950,218 V 275" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-completion)"/><path id="edge-completion-3" data-edge="3" d="M 800,344 H 710" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-completion)"/><path id="edge-completion-4" data-edge="4" d="M 410,344 H 320" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-completion)"/><a href="#source-S1" data-node="0" data-model="completion" tabindex="0" aria-label="1 · Request ID. Identify a durable operation or deposit request."><g><title>GaslessQ APIs: Identify a durable operation or deposit request. Sources: S1 S2</title><rect class="node-bg" x="20" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="80" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="20" y="96" width="300" height="14" fill="#f0edfa"/><text x="35" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="35" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">1 · Request ID</text><text x="35" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Identify a durable operation or deposit</text><text x="35" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">request.</text></g></a><a href="#source-S5" data-node="1" data-model="completion" tabindex="0" aria-label="2 · Transaction attempt. Link request_id to one or more attempts and tx_hash."><g><title>PostgreSQL: Link request_id to one or more attempts and tx_hash. Sources: S5</title><rect class="node-bg" x="410" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="80" width="300" height="30" rx="12" fill="#fcf2e4"/><rect x="410" y="96" width="300" height="14" fill="#fcf2e4"/><text x="425" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#8a5818">OTHER / INFRASTRUCTURE</text><text x="425" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">2 · Transaction attempt</text><text x="425" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Link request_id to one or more attempts</text><text x="425" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">and tx_hash.</text></g></a><a href="#source-S4" data-node="2" data-model="completion" tabindex="0" aria-label="3 · Transaction receipt. Look up execution result for that exact hash."><g><title>Chain JSON-RPC: Look up execution result for that exact hash. Sources: S4</title><rect class="node-bg" x="800" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="80" width="300" height="30" rx="12" fill="#fcf2e4"/><rect x="800" y="96" width="300" height="14" fill="#fcf2e4"/><text x="815" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#8a5818">OTHER / INFRASTRUCTURE</text><text x="815" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">3 · Transaction receipt</text><text x="815" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Look up execution result for that exact</text><text x="815" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">hash.</text></g></a><a href="#source-S3" data-node="3" data-model="completion" tabindex="0" aria-label="4 · Terminal service status. Persist succeeded / reverted and publish completion."><g><title>Executor worker: Persist succeeded / reverted and publish completion. Sources: S3</title><rect class="node-bg" x="800" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="800" y="275" width="300" height="30" rx="12" fill="#f0edfa"/><rect x="800" y="291" width="300" height="14" fill="#f0edfa"/><text x="815" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5945a6">SERVICE</text><text x="815" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">4 · Terminal service status</text><text x="815" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Persist succeeded / reverted and publish</text><text x="815" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">completion.</text></g></a><a href="#source-F2" data-node="4" data-model="completion" tabindex="0" aria-label="5 · Poll and correlate. Receive stored status/hash; resolve account or quote identifiers."><g><title>Vibe browser: Receive stored status/hash; resolve account or quote identifiers. Sources: F2 F4 F5</title><rect class="node-bg" x="410" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="275" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="410" y="291" width="300" height="14" fill="#e9f5f8"/><text x="425" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="425" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">5 · Poll and correlate</text><text x="425" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Receive stored status/hash; resolve</text><text x="425" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">account or quote identifiers.</text></g></a><a href="#source-F4" data-node="5" data-model="completion" tabindex="0" aria-label="6 · Check business outcome. Core balance, quote status/size, margin return and finality as needed."><g><title>Vibe browser: Core balance, quote status/size, margin return and finality as needed. Sources: F4 F5 F6</title><rect class="node-bg" x="20" y="275" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="20" y="275" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="20" y="291" width="300" height="14" fill="#e9f5f8"/><text x="35" y="295" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="35" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">6 · Check business outcome</text><text x="35" y="352" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Core balance, quote status/size, margin</text><text x="35" y="368" font-family="Arial,sans-serif" font-size="13" fill="#45566b">return and finality as needed.</text></g></a></svg>