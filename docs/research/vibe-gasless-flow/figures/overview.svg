<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 925" width="1120" height="925" role="img" aria-labelledby="title-overview desc-overview"><title id="title-overview">Two submission paths, one protocol state</title><desc id="desc-overview">Figure 1. Vibe uses GaslessQ for account operations and deposit settlement, and Enigma for market trades. The actual solver transaction wrapper remains unverified.</desc><defs><marker id="arrow-overview" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a98ab"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc" rx="16"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b45">Two submission paths, one protocol state</text><path id="edge-overview-0" data-edge="0" d="M 560,218 V 249.0 H 170 V 280" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-overview)"/><path id="edge-overview-1" data-edge="1" d="M 560,218 V 249.0 H 950 V 280" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-overview)"/><path id="edge-overview-2" data-edge="2" d="M 170,418 V 490" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-overview)"/><path id="edge-overview-3" data-edge="3" d="M 950,418 V 490" fill="none" stroke="#8a98ab" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-overview)"/><path id="edge-overview-4" data-edge="4" d="M 170,628 V 659.0 H 560 V 690" fill="none" stroke="#8a98ab" stroke-width="2" marker-end="url(#arrow-overview)"/><path id="edge-overview-5" data-edge="5" d="M 950,628 V 659.0 H 560 V 690" fill="none" stroke="#8a98ab" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-overview)"/><text x="365.0" y="241.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#536479" stroke="#f6f8fc" stroke-width="5" paint-order="stroke">Account / deposit</text><text x="755.0" y="241.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#536479" stroke="#f6f8fc" stroke-width="5" paint-order="stroke">Open / close</text><text x="179" y="454.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#536479" stroke="#f6f8fc" stroke-width="5" paint-order="stroke">Relayed transaction</text><text x="959" y="454.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#536479" stroke="#f6f8fc" stroke-width="5" paint-order="stroke">Wrapper unverified</text><text x="365.0" y="651.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#536479" stroke="#f6f8fc" stroke-width="5" paint-order="stroke">Account result</text><text x="755.0" y="651.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#536479" stroke="#f6f8fc" stroke-width="5" paint-order="stroke">Position result</text><a href="#source-F1" data-node="0" data-model="overview" tabindex="0" aria-label="Vibe browser. Build intent; display account and position results."><g><title>Vibe browser: Build intent; display account and position results. Sources: F1 F2 F5</title><rect class="node-bg" x="410" y="80" width="300" height="138" rx="12" fill="white" stroke="#d8e1eb" stroke-width="1.5"/><rect x="410" y="80" width="300" height="30" rx="12" fill="#e9f5f8"/><rect x="410" y="96" width="300" height="14" fill="#e9f5f8"/><text x="425" y="100" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#176b82">FRONTEND</text><text x="425" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b45">Vibe browser</text><text x="425" y="157" font-family="Arial,sans-serif" font-size="13" fill="#45566b">Build intent; display account and</text><text x="425" y="173" font-family="Arial,sans-serif" font-size="13" fill="#45566b">position results.</text></g></a><a href="#source-S1" data-node="1" data-model="overview" t