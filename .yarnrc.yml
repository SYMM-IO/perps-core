# Yarn 4 configuration.
#
# nodeLinker: node-modules is deliberate, not a leftover from the Yarn Classic days.
# Plug'n'Play (Yarn's default) resolves dependencies through a runtime shim instead of a
# real directory tree, and this repository has three things that read node_modules from
# disk: the postinstall patch in scripts/patch-hardhat-verify.js, which rewrites a file
# inside @nomicfoundation/hardhat-verify; the shell entrypoints that probe for
# node_modules/.bin/hardhat before running; and Hardhat's own plugin and compiler
# resolution. PnP would break all three.

nodeLinker: node-modules
